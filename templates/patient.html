{% extends "base.html" %}

{% block content %}
<!-- flash pop up screen-->
<div class="card shadow p-4">
    <h3 class="mb-4">Patient Dashboard 👤</h3>

    <!-- Book Appointment Section -->
    <h5>Book Appointment</h5>
    <form method="POST" action="/book_appointment" class="row g-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="col-md-4">
           <select name="doctor_email" class="form-control" required>
    <option value="">Select Doctor</option>
    {% for doctor in doctors %}
        <option value="{{ doctor[2] }}">
            Dr. {{ doctor[1] }} - {{ doctor[2] }}
        </option>
    {% endfor %}
</select>
        </div>

        <div class="col-md-3">
            <input type="date" name="appointment_date"
                   class="form-control"
                   required>
        </div>
        <div class="col-md-3">
            <input type="time" name="appointment_time"
            class="form-control" required>
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">
                Book
            </button>
        </div>

    </form>
  
    <hr class="my-4">

    <!-- My Appointments Section -->
    <h5>My Appointments</h5>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
  
            <tbody>
                {% for app in requests %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ app[1] }}</td>
                    <td>{{ app[2] }}</td>
                    <td>{{ app[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

    <div class="mt-3">
        <a href="/view_prescriptions" class="btn btn-outline-primary me-2">
            View Prescriptions
        </a>

        <a href="/view_bills" class="btn btn-outline-success">
            View Bills
        </a>
    </div>

</div>

{% endblock %}
